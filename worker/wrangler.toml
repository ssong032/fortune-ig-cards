name = "fortune-ig-bot"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# KV for approvals, owner chat id, and the refreshed Instagram token.
# The id is filled in after `wrangler kv namespace create STATE`.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

[triggers]
crons = ["*/5 * * * *"]

# Secrets (never commit): TELEGRAM_BOT_TOKEN, IG_ACCESS_TOKEN, WEBHOOK_SECRET
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
